<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Corporate Prep</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{ --paper:#F6F3EC; --paper-raised:#FFFFFF; --ink:#202420; --ink-soft:#5B6158; --line:#DCD5C4; --denim:#35597A; --denim-soft:#E5EBF0;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:transparent; color:var(--ink); font-family:'Inter',sans-serif; line-height:1.5;}
  .wrap{max-width:1000px; margin:0 auto; padding:0 32px;}

  .page-head{padding: 36px 0; text-align: center; display: flex; flex-direction: column; align-items: center;}
  .eyebrow{font-family:'IBM Plex Mono',monospace; font-size:0.78rem; color:var(--denim); text-transform:uppercase; letter-spacing:0.08em; display:inline-flex; align-items:center; gap:8px; margin-bottom:16px;}
  .eyebrow::before{content:""; width:7px; height:7px; border-radius:50%; background:var(--denim);}
  h1{font-family:'Fraunces',serif; font-weight:500; font-size:clamp(2rem,3.6vw,2.8rem); margin-bottom:16px; letter-spacing:-0.01em;}
  .page-sub{color:var(--ink-soft); font-size:1.02rem; max-width:56ch; margin-bottom:28px;}

  .controls{display:flex; gap:12px; justify-content: center; flex-wrap:wrap; margin-bottom: 20px;}
  select{font-family:'Inter',sans-serif; font-size:0.85rem; padding:10px 14px; border-radius:6px; border:1px solid var(--line); background:var(--paper-raised); color:var(--ink); outline:none;}
  select:focus{border-color:var(--denim);}

  .btn{font-family:'IBM Plex Mono',monospace; font-size:0.82rem; padding:10px 18px; border-radius:5px; border:1px solid var(--ink); display:inline-block; transition:transform .15s ease; cursor:pointer; background:none;}
  .btn-primary{background:var(--ink); color:var(--paper);}
  .btn-primary:hover{transform:translateY(-1px); background:var(--denim); border-color:var(--denim);}
  .btn-ghost:hover{background:var(--ink); color:var(--paper);}
  .btn.small{padding:6px 12px; font-size:0.72rem;}
  .btn[disabled]{opacity:0.55; cursor:default; transform:none;}

  section.content{padding:12px 0 80px;}
  .grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(280px,1fr)); gap:20px; position:relative;}
  .swap-area{position:relative;}
  svg.threads{position:absolute; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:1;}

  .card{background:var(--paper-raised); border:1px solid var(--line); border-radius:10px; padding:24px; position:relative; transition:box-shadow .15s ease, transform .15s ease;}
  .card:hover{box-shadow:0 8px 24px rgba(32,36,32,0.08); transform:translateY(-2px); z-index:5;}
  .card h3{font-family:'Fraunces',serif; font-weight:500; font-size:1.15rem; margin-bottom:4px;}
  .card .meta{font-size:0.82rem; color:var(--ink-soft); margin-bottom:14px; display:flex; align-items:center; gap:8px;}
  .stars{color:var(--denim); font-size:0.82rem; letter-spacing:1px;}
  .tagrow{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:8px;}
  .tag{font-family:'IBM Plex Mono',monospace; font-size:0.7rem; padding:4px 9px; border-radius:20px; font-weight:500;}
  .tag.give{background:var(--denim-soft); color:var(--denim);}
  .tag.want{background:#F5E7DF; color:#B5502F;}
  .card-foot{display:flex; justify-content:flex-end; align-items:center; margin-top:16px; padding-top:16px; border-top:1px dashed var(--line);}
  .empty{text-align:center; padding:70px 20px; color:var(--ink-soft); font-family:'IBM Plex Mono',monospace; font-size:0.85rem;}

  .modal-bg{position:fixed; inset:0; background:rgba(32,36,32,0.45); display:none; align-items:center; justify-content:center; z-index:100;}
  .modal-bg.show{display:flex;}
  .modal{background:var(--paper-raised); border:1px solid var(--line); border-radius:10px; padding:28px; width:min(420px,90vw);}
  .modal h3{font-family:'Fraunces',serif; font-size:1.2rem; margin-bottom:8px;}
  .modal textarea{width:100%; min-height:90px; font-family:'Inter',sans-serif; font-size:0.88rem; border-radius:6px; border:1px solid var(--line); padding:12px; resize:vertical; margin-bottom:18px;}
  .modal-actions{display:flex; justify-content:flex-end; gap:10px;}
</style>
</head>
<body>

<section class="page-head wrap">
  <h1>Corporate Prep</h1>
  <p class="page-sub">Trade interview and application practice with other students. You review my resume, I run your mock interview.</p>
  <div class="controls">
    <select id="prepOffered"><option value="">Can help with — any</option></select>
    <select id="prepWanted"><option value="">Looking for — any</option></select>
  </div>
</section>

<section class="content wrap">
  <div class="swap-area">
    <svg class="threads" id="threadSvg"></svg>
    <div class="grid" id="prepGrid"></div>
  </div>
</section>

<div class="modal-bg" id="modalBg">
  <div class="modal">
    <h3 id="modalTitle">Propose a swap</h3>
    <div class="modal-body" id="modalBody" style="font-size:0.85rem; color:var(--ink-soft); margin-bottom:14px;"></div>
    <textarea id="modalMsg" placeholder="Say what you'd like practice on and when you're free…"></textarea>
    <div class="modal-actions">
      <button class="btn btn-ghost small" id="modalCancel">Cancel</button>
      <button class="btn btn-primary small" id="modalSend">Send</button>
    </div>
  </div>
</div>

<script>
const prepUsers = [
  {name:"Owen Baptiste", track:"SWE, Senior", rating:4.9, give:["Technical Mock Interview","LeetCode Review"], want:["Resume Review"]},
  {name:"Farah Idris", track:"HR/Business, Junior", rating:4.7, give:["Resume Review","Cover Letter Edits"], want:["Technical Mock Interview"]},
  {name:"Tomas Reyes", track:"Consulting, Senior", rating:4.8, give:["Case Interview Practice"], want:["LinkedIn Audit"]},
  {name:"Ivy Sorenson", track:"Marketing, Sophomore", rating:4.5, give:["LinkedIn Audit","Portfolio Feedback"], want:["Case Interview Practice"]},
  {name:"Priya Nandan", track:"CS, Junior", rating:4.8, give:["LeetCode Review","GitHub Portfolio Review"], want:["Behavioral Interview Practice"]},
  {name:"Marco Ilić", track:"Film & Media, Senior", rating:4.6, give:["Behavioral Interview Practice","Elevator Pitch Coaching"], want:["GitHub Portfolio Review"]},
];

function uniqueTracks(){ const s = new Set(); prepUsers.forEach(u=>{ u.give.forEach(x=>s.add(x)); u.want.forEach(x=>s.add(x)); }); return [...s].sort(); }
function populateSelect(sel, items){ items.forEach(i=>{ const o=document.createElement('option'); o.value=i; o.textContent=i; sel.appendChild(o); }); }
populateSelect(document.getElementById('prepOffered'), uniqueTracks()); populateSelect(document.getElementById('prepWanted'), uniqueTracks());

function findMatchIndex(user, idx){
  for(let j=0;j<prepUsers.length;j++){
    if(j===idx) continue;
    const other = prepUsers[j];
    if(user.want.some(w=>other.give.includes(w)) && other.want.some(w=>user.give.includes(w))) return j;
  }
  return -1;
}

function renderPrep(){
  const offered = document.getElementById('prepOffered').value, wanted = document.getElementById('prepWanted').value;
  const grid = document.getElementById('prepGrid'); grid.innerHTML = '';
  const filtered = prepUsers.filter(u => (!offered || u.give.includes(offered)) && (!wanted || u.want.includes(wanted)));
  if(filtered.length===0){ grid.innerHTML = '<div class="empty">No matches for that combo.</div>'; drawThreads(); return; }
  filtered.forEach(u=>{
    const realIdx = prepUsers.indexOf(u);
    const card = document.createElement('div'); card.className='card'; card.dataset.idx = realIdx;
    card.innerHTML = `
      <h3>${u.name}</h3>
      <div class="meta">${u.track} · <span class="stars">${'★'.repeat(Math.round(u.rating))}${'☆'.repeat(5-Math.round(u.rating))}</span> ${u.rating}</div>
      <div class="tagrow">${u.give.map(g=>`<span class="tag give">OFFERS · ${g}</span>`).join('')}</div>
      <div class="tagrow">${u.want.map(w=>`<span class="tag want">WANTS · ${w}</span>`).join('')}</div>
      <div class="card-foot"><button class="btn btn-primary small" data-propose="${realIdx}">Propose Swap</button></div>
    `;
    card.addEventListener('mouseenter', ()=>highlightMatch(realIdx, true));
    card.addEventListener('mouseleave', ()=>highlightMatch(realIdx, false));
    grid.appendChild(card);
  });
  grid.querySelectorAll('[data-propose]').forEach(b=>b.addEventListener('click', ()=>openModal(+b.dataset.propose)));
  requestAnimationFrame(drawThreads);
}
document.getElementById('prepOffered').addEventListener('change', renderPrep); document.getElementById('prepWanted').addEventListener('change', renderPrep);

let activeThread = null;
function highlightMatch(idx, on){ activeThread = on ? idx : null; drawThreads(); }
function drawThreads(){
  const svg = document.getElementById('threadSvg'), area = document.querySelector('.swap-area'); svg.innerHTML = '';
  if(activeThread===null) return;
  const user = prepUsers[activeThread], matchIdx = findMatchIndex(user, activeThread); if(matchIdx===-1) return;
  const cardA = document.querySelector(`#prepGrid .card[data-idx="${activeThread}"]`), cardB = document.querySelector(`#prepGrid .card[data-idx="${matchIdx}"]`);
  if(!cardA || !cardB) return;
  const rectArea = area.getBoundingClientRect(), rA = cardA.getBoundingClientRect(), rB = cardB.getBoundingClientRect();
  const x1 = rA.left+rA.width/2-rectArea.left, y1 = rA.top+rA.height/2-rectArea.top, x2 = rB.left+rB.width/2-rectArea.left, y2 = rB.top+rB.height/2-rectArea.top;
  svg.setAttribute('viewBox', `0 0 ${rectArea.width} ${rectArea.height}`);
  const path = document.createElementNS('http://www.w3.org/2000/svg','path');
  path.setAttribute('d', `M${x1},${y1} Q${(x1+x2)/2},${(y1+y2)/2 - 30} ${x2},${y2}`);
  path.setAttribute('stroke', '#35597A'); path.setAttribute('stroke-width','2'); path.setAttribute('fill','none'); path.setAttribute('stroke-dasharray','5 5');
  svg.appendChild(path);
}
window.addEventListener('resize', drawThreads);

const modalBg = document.getElementById('modalBg'), modalTitle = document.getElementById('modalTitle'), modalBody = document.getElementById('modalBody'), modalMsg = document.getElementById('modalMsg');
let modalIdx = null;
function openModal(idx){
  modalIdx = idx; const u = prepUsers[idx];
  modalTitle.textContent = `Propose a swap with ${u.name}`; modalBody.textContent = `They offer: ${u.give.join(', ')} · They want: ${u.want.join(', ')}`;
  modalMsg.value = ''; modalBg.classList.add('show'); modalMsg.focus();
}
document.getElementById('modalCancel').addEventListener('click', ()=>modalBg.classList.remove('show'));
modalBg.addEventListener('click', e=>{ if(e.target===modalBg) modalBg.classList.remove('show'); });
document.getElementById('modalSend').addEventListener('click', ()=>{
  modalBg.classList.remove('show'); const btn = document.querySelector(`[data-propose="${modalIdx}"]`);
  if(btn){ btn.textContent='Sent ✓'; btn.disabled = true; }
});
renderPrep();
</script>
</body>
</html>
