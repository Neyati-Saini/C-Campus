<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Micro-Gigs Board</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{ --paper:#F6F3EC; --paper-raised:#FFFFFF; --ink:#202420; --ink-soft:#5B6158; --line:#DCD5C4; --denim:#35597A; --denim-soft:#E5EBF0;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:transparent; color:var(--ink); font-family:'Inter',sans-serif; line-height:1.5;}
  .wrap{max-width:1000px; margin:0 auto; padding:0 32px;}

  .page-head{padding: 36px 0; text-align: center; display: flex; flex-direction: column; align-items: center;}
  .eyebrow{font-family:'IBM Plex Mono',monospace; font-size:0.78rem; color:var(--denim); text-transform:uppercase; letter-spacing:0.08em; display:inline-flex; align-items:center; gap:8px; margin-bottom:16px;}
  .eyebrow::before{content:""; width:7px; height:7px; border-radius:50%; background:var(--denim);}
  h1{font-family:'Fraunces',serif; font-weight:500; font-size:clamp(2rem,3.6vw,2.8rem); margin-bottom:16px; letter-spacing:-0.01em;}
  .page-sub{color:var(--ink-soft); font-size:1.02rem; max-width:56ch; margin-bottom:28px;}

  .controls{display:flex; gap:12px; justify-content: center; flex-wrap:wrap; margin-bottom: 20px;}
  select{font-family:'Inter',sans-serif; font-size:0.85rem; padding:10px 14px; border-radius:6px; border:1px solid var(--line); background:var(--paper-raised); color:var(--ink); outline:none;}
  select:focus{border-color:var(--denim);}

  .btn{font-family:'IBM Plex Mono',monospace; font-size:0.82rem; padding:10px 18px; border-radius:5px; border:1px solid var(--ink); display:inline-block; transition:transform .15s ease; cursor:pointer; background:none;}
  .btn-primary{background:var(--ink); color:var(--paper);}
  .btn-primary:hover{transform:translateY(-1px); background:var(--denim); border-color:var(--denim);}
  .btn-ghost:hover{background:var(--ink); color:var(--paper);}
  .btn.small{padding:6px 12px; font-size:0.72rem;}
  .btn[disabled]{opacity:0.55; cursor:default; transform:none;}

  section.content{padding:12px 0 80px;}
  .grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(280px,1fr)); gap:20px;}
  .card{background:var(--paper-raised); border:1px solid var(--line); border-radius:10px; padding:24px; transition:box-shadow .15s ease, transform .15s ease; position:relative;}
  .card:hover{box-shadow:0 8px 24px rgba(32,36,32,0.08); transform:translateY(-2px);}
  .pay{position:absolute; top:24px; right:24px; font-family:'IBM Plex Mono',monospace; font-size:0.85rem; font-weight:600; color:var(--denim); background:var(--denim-soft); padding:4px 10px; border-radius:20px;}
  .card h3{font-family:'Fraunces',serif; font-weight:500; font-size:1.1rem; margin-bottom:4px; padding-right:80px;}
  .card .meta{font-size:0.8rem; color:var(--ink-soft); margin-bottom:12px; font-family:'IBM Plex Mono',monospace;}
  .card .desc{font-size:0.88rem; color:var(--ink-soft); margin-bottom:14px;}
  .tagrow{display:flex; flex-wrap:wrap; gap:6px;}
  .tag{font-family:'IBM Plex Mono',monospace; font-size:0.7rem; padding:4px 9px; border-radius:20px; font-weight:500; background:var(--paper); border:1px solid var(--line);}
  .card-foot{display:flex; justify-content:space-between; align-items:center; margin-top:16px; padding-top:16px; border-top:1px dashed var(--line);}
  .spots{font-family:'IBM Plex Mono',monospace; font-size:0.72rem; color:var(--ink-soft);}
  .empty{text-align:center; padding:70px 20px; color:var(--ink-soft); font-family:'IBM Plex Mono',monospace; font-size:0.85rem;}

  .modal-bg{position:fixed; inset:0; background:rgba(32,36,32,0.45); display:none; align-items:center; justify-content:center; z-index:100;}
  .modal-bg.show{display:flex;}
  .modal{background:var(--paper-raised); border:1px solid var(--line); border-radius:10px; padding:28px; width:min(420px,90vw);}
  .modal h3{font-family:'Fraunces',serif; font-size:1.2rem; margin-bottom:8px;}
  .modal textarea{width:100%; min-height:90px; font-family:'Inter',sans-serif; font-size:0.88rem; border-radius:6px; border:1px solid var(--line); padding:12px; resize:vertical; margin-bottom:18px;}
  .modal-actions{display:flex; justify-content:flex-end; gap:10px;}
</style>
</head>
<body>

<section class="page-head wrap">
  <h1>Micro-Gigs Board</h1>
  <p class="page-sub">Short, paid campus work. Show up, do the job, get paid — no long-term commitment.</p>
  <div class="controls">
    <select id="gigCategory"><option value="">Category — any</option></select>
    <select id="gigSort">
      <option value="recent">Sort — most recent</option>
      <option value="pay">Sort — highest pay</option>
    </select>
  </div>
</section>

<section class="content wrap">
  <div class="grid" id="gigGrid"></div>
</section>

<div class="modal-bg" id="modalBg">
  <div class="modal">
    <h3 id="modalTitle">Apply for this gig</h3>
    <div class="modal-body" id="modalBody" style="font-size:0.85rem; color:var(--ink-soft); margin-bottom:14px;"></div>
    <textarea id="modalMsg" placeholder="A line or two on your availability and why you're a fit…"></textarea>
    <div class="modal-actions">
      <button class="btn btn-ghost small" id="modalCancel">Cancel</button>
      <button class="btn btn-primary small" id="modalSend">Send Application</button>
    </div>
  </div>
</div>

<script>
const gigs = [
  {title:"Campus Event Setup — Alumni Dinner", cat:"Events", pay:20, unit:"/hr", hours:"4 hrs", when:"Sat, 5pm", spots:3, desc:"Set up tables, linens, and AV for a formal alumni dinner in the Great Hall."},
  {title:"Flyer Distribution — Orientation Week", cat:"Marketing", pay:15, unit:"/hr", hours:"3 hrs", when:"Mon, 9am", spots:6, desc:"Hand out welcome flyers at the main quad during move-in."},
  {title:"Moving Help — Faculty Office Relocation", cat:"Labor", pay:22, unit:"/hr", hours:"5 hrs", when:"Wed, 1pm", spots:2, desc:"Help a professor move boxes and furniture between two campus buildings."},
  {title:"Photographer — Club Fair", cat:"Creative", pay:60, unit:"flat", hours:"2 hrs", when:"Fri, 11am", spots:1, desc:"Shoot candid photos of booths and attendees for the club fair recap post."},
  {title:"Data Entry — Alumni Survey Cleanup", cat:"Admin", pay:18, unit:"/hr", hours:"6 hrs", when:"Flexible", spots:4, desc:"Clean and tag survey responses in a shared spreadsheet, work from anywhere."},
  {title:"Tutor Coverage — Last-Minute Sub", cat:"Tutoring", pay:25, unit:"/hr", hours:"1.5 hrs", when:"Tomorrow, 3pm", spots:1, desc:"Cover a single Calc I tutoring session for a student who's out sick."},
];

function populateSelect(sel, items){ items.forEach(i=>{ const o=document.createElement('option'); o.value=i; o.textContent=i; sel.appendChild(o); }); }
populateSelect(document.getElementById('gigCategory'), [...new Set(gigs.map(g=>g.cat))]);

function renderGigs(){
  const cat = document.getElementById('gigCategory').value;
  const sort = document.getElementById('gigSort').value;
  const grid = document.getElementById('gigGrid'); grid.innerHTML = '';
  let filtered = gigs.filter(g => !cat || g.cat === cat);
  if(sort === 'pay') filtered = [...filtered].sort((a,b)=>b.pay-a.pay);
  if(filtered.length===0){ grid.innerHTML = '<div class="empty">No gigs in that category right now.</div>'; return; }
  filtered.forEach(g=>{
    const realIdx = gigs.indexOf(g);
    const card = document.createElement('div'); card.className='card';
    card.innerHTML = `
      <span class="pay">$${g.pay}${g.unit}</span>
      <h3>${g.title}</h3>
      <div class="meta">${g.cat} · ${g.hours} · ${g.when}</div>
      <div class="desc">${g.desc}</div>
      <div class="card-foot">
        <span class="spots">${g.spots} spot${g.spots>1?'s':''} left</span>
        <button class="btn btn-primary small" data-apply="${realIdx}">Apply</button>
      </div>
    `;
    grid.appendChild(card);
  });
  grid.querySelectorAll('[data-apply]').forEach(b=>b.addEventListener('click', ()=>openModal(+b.dataset.apply)));
}
document.getElementById('gigCategory').addEventListener('change', renderGigs);
document.getElementById('gigSort').addEventListener('change', renderGigs);

const modalBg = document.getElementById('modalBg'), modalTitle = document.getElementById('modalTitle'), modalBody = document.getElementById('modalBody'), modalMsg = document.getElementById('modalMsg');
let modalIdx = null;
function openModal(idx){
  modalIdx = idx; const g = gigs[idx];
  modalTitle.textContent = `Apply — ${g.title}`;
  modalBody.textContent = `${g.hours} · ${g.when} · Pays $${g.pay}${g.unit}`;
  modalMsg.value = ''; modalBg.classList.add('show'); modalMsg.focus();
}
document.getElementById('modalCancel').addEventListener('click', ()=>modalBg.classList.remove('show'));
modalBg.addEventListener('click', e=>{ if(e.target===modalBg) modalBg.classList.remove('show'); });
document.getElementById('modalSend').addEventListener('click', ()=>{
  modalBg.classList.remove('show');
  const btn = document.querySelector(`[data-apply="${modalIdx}"]`);
  if(btn){ btn.textContent='Applied ✓'; btn.disabled = true; }
});
renderGigs();
</script>
</body>
</html>
