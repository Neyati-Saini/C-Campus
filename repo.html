<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Repositories · C.Campus</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F6F3EC; --paper-raised:#FFFFFF; --ink:#202420; --ink-soft:#5B6158; --line:#DCD5C4;
    --moss:#2F6F4E; --moss-soft:#E7F0EA;
    --denim:#35597A; --denim-soft:#E5EBF0;
    --brick:#B5502F; --brick-soft:#F5E7DF;
    --theme-main:var(--moss); --theme-soft:var(--moss-soft);
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--paper);color:var(--ink);font-family:'Inter',sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased;}
  a{color:inherit;text-decoration:none;}
  .mono{font-family:'IBM Plex Mono',monospace;letter-spacing:0.02em;}
  ::selection{background:var(--moss-soft);color:var(--moss);}

  .hero{padding:40px 28px 8px;max-width:1180px;margin:0 auto;}
  .eyebrow{font-size:0.72rem;color:var(--theme-main);font-weight:500;text-transform:uppercase;letter-spacing:0.08em;margin-bottom:10px;display:flex;align-items:center;gap:8px;}
  .eyebrow::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--theme-main);}
  h1{font-family:'Fraunces',serif;font-weight:600;font-size:2.6rem;letter-spacing:-0.01em;}
  .hero p.sub{color:var(--ink-soft);margin-top:8px;font-size:0.98rem;max-width:560px;}

  .toolbar{max-width:1180px;margin:24px auto 0;padding:0 28px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;}
  .search-wrap{flex:1;min-width:220px;display:flex;align-items:center;gap:8px;background:var(--paper-raised);border:1px solid var(--line);border-radius:10px;padding:10px 14px;transition:border-color .2s ease;}
  .search-wrap:focus-within{border-color:var(--theme-main);}
  .search-wrap svg{flex-shrink:0;opacity:0.5;}
  .search-wrap input{border:none;outline:none;background:none;font-family:'Inter',sans-serif;font-size:0.9rem;width:100%;color:var(--ink);}
  select.filt{background:var(--paper-raised);border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-family:'IBM Plex Mono',monospace;font-size:0.76rem;color:var(--ink-soft);cursor:pointer;}
  select.filt:focus{border-color:var(--theme-main);outline:none;}

  .count-row{max-width:1180px;margin:20px auto 0;padding:0 28px;display:flex;justify-content:space-between;align-items:center;}
  .count-row span{font-family:'IBM Plex Mono',monospace;font-size:0.72rem;color:var(--ink-soft);}

  .grid{max-width:1180px;margin:16px auto 90px;padding:0 28px;display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:20px;}
  .card{background:var(--paper-raised);border:1px solid var(--line);border-radius:14px;padding:20px;opacity:0;transform:translateY(14px);animation:rise .5s ease forwards;transition:transform .25s ease,box-shadow .25s ease;}
  .card:hover{transform:translateY(-4px);box-shadow:0 14px 30px -14px rgba(32,36,32,0.18);}
  @keyframes rise{to{opacity:1;transform:translateY(0);}}

  .card-top{display:flex;align-items:center;gap:12px;margin-bottom:12px;}
  .repo-icon{width:42px;height:42px;border-radius:11px;background:var(--moss-soft);color:var(--moss);display:flex;align-items:center;justify-content:center;flex-shrink:0;transform:rotate(-3deg);}
  .repo-icon svg{width:20px;height:20px;}
  .card-title{font-family:'Fraunces',serif;font-size:1.06rem;font-weight:500;}
  .card-meta{font-size:0.74rem;color:var(--ink-soft);font-family:'IBM Plex Mono',monospace;margin-top:2px;}

  .tagrow{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px;}
  .tag{font-family:'IBM Plex Mono',monospace;font-size:0.68rem;padding:4px 9px;border-radius:20px;font-weight:500;background:var(--paper);border:1px solid var(--line);}

  .card-foot{display:flex;justify-content:space-between;align-items:center;padding-top:14px;border-top:1px dashed var(--line);}
  .toggle{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-family:'IBM Plex Mono',monospace;font-size:0.72rem;color:var(--ink-soft);}
  .switch{width:32px;height:18px;background:var(--line);border-radius:20px;position:relative;transition:.15s;}
  .switch::after{content:'';position:absolute;width:14px;height:14px;background:#fff;border-radius:50%;top:2px;left:2px;transition:.15s;box-shadow:0 1px 2px rgba(0,0,0,0.2);}
  .switch.on{background:var(--moss);}
  .switch.on::after{left:16px;}

  .foot-actions{display:flex;gap:6px;}
  .btn-icon{width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:var(--paper);cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--ink-soft);transition:all .18s ease;}
  .btn-icon:hover{border-color:var(--theme-main);color:var(--theme-main);}
  .btn-icon svg{width:14px;height:14px;}

  .empty{max-width:1180px;margin:60px auto;padding:0 28px;text-align:center;color:var(--ink-soft);}
  .empty h3{font-family:'Fraunces',serif;font-size:1.3rem;color:var(--ink);margin-bottom:6px;}
  .hidden{display:none !important;}

  .toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--paper);padding:13px 22px;border-radius:10px;font-family:'IBM Plex Mono',monospace;font-size:0.8rem;opacity:0;pointer-events:none;transition:all .3s ease;z-index:300;display:flex;align-items:center;gap:10px;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  .toast .dot{width:7px;height:7px;border-radius:50%;background:var(--moss);}

  @media (max-width:640px){h1{font-size:2rem;} .hero,.toolbar,.count-row,.grid{padding-left:16px;padding-right:16px;}}
</style>
</head>
<body>

<section class="hero">
  <div class="eyebrow">Every build, tracked</div>
  <h1>My Repositories</h1>
  <p class="sub">Your academic and side-project codebases in one place. Flip a repo public when it's ready for your portfolio.</p>
</section>

<div class="toolbar">
  <div class="search-wrap">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <input id="searchInput" type="text" placeholder="Search repositories or tech stack…">
  </div>
  <select class="filt mono" id="visFilter">
    <option value="">All repos</option>
    <option value="public">Public only</option>
    <option value="private">Private only</option>
  </select>
</div>

<div class="count-row">
  <span id="countLabel" class="mono">— repositories</span>
  <span class="mono">LAST UPDATED, NEWEST FIRST</span>
</div>

<div class="grid" id="grid"></div>
<div class="empty hidden" id="emptyState"><h3>No repositories match</h3><p>Try a different search term.</p></div>

<div class="toast" id="toast"><span class="dot"></span><span id="toastText">Updated</span></div>

<script>
const CODE_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M8 6L2 12l6 6"/><path d="M16 6l6 6-6 6"/></svg>';

let REPOS = [
  {id:1,name:'pathfinder-viz',tech:['Python','NetworkX'],updated:'3 days ago',rank:3,isPublic:true},
  {id:2,name:'iot-attendance-firmware',tech:['C++','ESP32'],updated:'1 week ago',rank:7,isPublic:false},
  {id:3,name:'note-synth-frontend',tech:['React','Tailwind'],updated:'Today',rank:0,isPublic:true},
  {id:4,name:'stats-241-problem-sets',tech:['R','Markdown'],updated:'2 weeks ago',rank:14,isPublic:false},
  {id:5,name:'campushive-sensor-node',tech:['C','Arduino'],updated:'5 days ago',rank:5,isPublic:true},
  {id:6,name:'greenroute-optimizer',tech:['Python','Flask'],updated:'Yesterday',rank:1,isPublic:false}
];

function render(){
  const q=document.getElementById('searchInput').value.toLowerCase();
  const vis=document.getElementById('visFilter').value;
  let list = REPOS.filter(r =>
    (!q || r.name.toLowerCase().includes(q) || r.tech.some(t=>t.toLowerCase().includes(q))) &&
    (!vis || (vis==='public'? r.isPublic : !r.isPublic))
  );
  list = [...list].sort((a,b)=>a.rank-b.rank);

  document.getElementById('countLabel').textContent = `${list.length} repositor${list.length!==1?'ies':'y'}`;
  document.getElementById('emptyState').classList.toggle('hidden', list.length>0);

  document.getElementById('grid').innerHTML = list.map((r,idx)=>`
    <div class="card" style="animation-delay:${idx*0.05}s">
      <div class="card-top">
        <div class="repo-icon">${CODE_ICON}</div>
        <div>
          <div class="card-title">${r.name}</div>
          <div class="card-meta">Last updated ${r.updated}</div>
        </div>
      </div>
      <div class="tagrow">${r.tech.map(t=>`<span class="tag">${t}</span>`).join('')}</div>
      <div class="card-foot">
        <label class="toggle">
          <span class="switch ${r.isPublic?'on':''}" data-toggle="${r.id}"></span>
          ${r.isPublic?'Public':'Private'}
        </label>
        <div class="foot-actions">
          <button class="btn-icon" title="Open on GitHub" data-github="${r.id}">${CODE_ICON}</button>
        </div>
      </div>
    </div>
  `).join('');

  document.querySelectorAll('[data-toggle]').forEach(s=>s.addEventListener('click',()=>{
    const rep = REPOS.find(x=>x.id==s.dataset.toggle);
    rep.isPublic = !rep.isPublic;
    render();
    showToast(`${rep.name} set to ${rep.isPublic?'Public':'Private'}`);
  }));
  document.querySelectorAll('[data-github]').forEach(b=>b.addEventListener('click',()=>{
    const rep = REPOS.find(x=>x.id==b.dataset.github);
    showToast(`Opening ${rep.name} on GitHub…`);
  }));
}

function showToast(text){
  const t=document.getElementById('toast');
  document.getElementById('toastText').textContent=text;
  t.classList.add('show');
  clearTimeout(window._toastTimer);
  window._toastTimer=setTimeout(()=>t.classList.remove('show'),2600);
}

document.getElementById('searchInput').addEventListener('input',render);
document.getElementById('visFilter').addEventListener('change',render);
render();
</script>
</body>
</html>
