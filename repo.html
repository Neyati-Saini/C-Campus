<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Repositories</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{ --paper:#F6F3EC; --paper-raised:#FFFFFF; --ink:#202420; --ink-soft:#5B6158; --line:#DCD5C4; --moss:#2F6F4E;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:transparent; color:var(--ink); font-family:'Inter',sans-serif; line-height:1.5;}
  .wrap{max-width:1000px; margin:0 auto; padding:0 32px;}
  
  .page-head{padding: 36px 0; text-align: center; display: flex; flex-direction: column; align-items: center;}
  .eyebrow{font-family:'IBM Plex Mono',monospace; font-size:0.78rem; color:var(--moss); text-transform:uppercase; letter-spacing:0.08em; display:inline-flex; align-items:center; gap:8px; margin-bottom:16px;}
  .eyebrow::before{content:""; width:7px; height:7px; border-radius:50%; background:var(--moss);}
  h1{font-family:'Fraunces',serif; font-weight:500; font-size:clamp(2rem,3.6vw,2.8rem); margin-bottom:16px; letter-spacing:-0.01em;}
  .page-sub{color:var(--ink-soft); font-size:1.02rem; max-width:56ch; margin-bottom:28px;}

  .controls{display:flex; gap:12px; justify-content: center; flex-wrap:wrap; margin-bottom: 20px;}
  input[type=text]{font-family:'Inter',sans-serif; font-size:0.85rem; padding:10px 14px; border-radius:6px; border:1px solid var(--line); background:var(--paper-raised); color:var(--ink); outline:none; min-width:260px;}
  input:focus{border-color:var(--moss);}

  .btn{font-family:'IBM Plex Mono',monospace; font-size:0.82rem; padding:10px 18px; border-radius:5px; border:1px solid var(--ink); display:inline-block; transition:transform .15s ease; cursor:pointer; background:none;}
  .btn-ghost:hover{background:var(--ink); color:var(--paper);}
  .btn.small{padding:6px 12px; font-size:0.72rem;}

  section.content{padding:12px 0 80px;}
  .grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(280px,1fr)); gap:20px;}
  .card{background:var(--paper-raised); border:1px solid var(--line); border-radius:10px; padding:24px; transition:box-shadow .15s ease, transform .15s ease;}
  .card:hover{box-shadow:0 8px 24px rgba(32,36,32,0.08); transform:translateY(-2px);}
  .card h3{font-family:'Fraunces',serif; font-weight:500; font-size:1.1rem; margin-bottom:4px;}
  .card .meta{font-size:0.8rem; color:var(--ink-soft); margin-bottom:12px; font-family:'IBM Plex Mono',monospace;}
  .tagrow{display:flex; flex-wrap:wrap; gap:6px;}
  .tag{font-family:'IBM Plex Mono',monospace; font-size:0.7rem; padding:4px 9px; border-radius:20px; font-weight:500; background:var(--paper); border:1px solid var(--line);}
  .card-foot{display:flex; justify-content:space-between; align-items:center; margin-top:16px; padding-top:16px; border-top:1px dashed var(--line);}

  .toggle{display:inline-flex; align-items:center; gap:8px; cursor:pointer; font-family:'IBM Plex Mono',monospace; font-size:0.72rem; color:var(--ink-soft);}
  .switch{width:32px; height:18px; background:var(--line); border-radius:20px; position:relative; transition:.15s;}
  .switch::after{content:''; position:absolute; width:14px; height:14px; background:#fff; border-radius:50%; top:2px; left:2px; transition:.15s; box-shadow:0 1px 2px rgba(0,0,0,0.2);}
  .switch.on{background:var(--moss);}
  .switch.on::after{left:16px;}
  .empty{text-align:center; padding:70px 20px; color:var(--ink-soft); font-family:'IBM Plex Mono',monospace; font-size:0.85rem;}
</style>
</head>
<body>

<section class="page-head wrap">
  <h1>My Repositories</h1>
  <p class="page-sub">Every codebase you're building, tracked in one place. Flip a repo public when it's ready.</p>
  <div class="controls">
    <input type="text" id="repoSearch" placeholder="Search repositories…">
  </div>
</section>

<section class="content wrap">
  <div class="grid" id="repoGrid"></div>
</section>

<script>
const repos = [
  {name:"pathfinder-viz", tech:["Python","NetworkX"], updated:"3 days ago", isPublic:true},
  {name:"iot-attendance-firmware", tech:["C++","ESP32"], updated:"1 week ago", isPublic:false},
  {name:"note-synth-frontend", tech:["React","Tailwind"], updated:"Today", isPublic:true},
  {name:"stats-241-problem-sets", tech:["R","Markdown"], updated:"2 weeks ago", isPublic:false},
];

function renderRepos(){
  const q = document.getElementById('repoSearch').value.toLowerCase();
  const grid = document.getElementById('repoGrid'); grid.innerHTML='';
  const filtered = repos.filter(r => !q || r.name.toLowerCase().includes(q) || r.tech.some(t=>t.toLowerCase().includes(q)));
  if(filtered.length===0){ grid.innerHTML='<div class="empty">No repositories match your search.</div>'; return; }
  filtered.forEach(r=>{
    const card = document.createElement('div'); card.className='card';
    card.innerHTML = `
      <h3>${r.name}</h3><div class="meta">Last updated ${r.updated}</div>
      <div class="tagrow">${r.tech.map(t=>`<span class="tag">${t}</span>`).join('')}</div>
      <div class="card-foot">
        <label class="toggle"><span class="switch ${r.isPublic?'on':''}" data-toggle="${r.name}"></span>${r.isPublic ? 'Public' : 'Private'}</label>
        <button class="btn btn-ghost small">View</button>
      </div>
    `;
    grid.appendChild(card);
  });
  grid.querySelectorAll('[data-toggle]').forEach(s=>s.addEventListener('click', ()=>{
    const r = repos.find(x=>x.name===s.dataset.toggle); r.isPublic = !r.isPublic; renderRepos();
  }));
}
document.getElementById('repoSearch').addEventListener('input', renderRepos);
renderRepos();
</script>
</body>
</html>
