<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Project Matchmaker</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{ --paper:#F6F3EC; --paper-raised:#FFFFFF; --ink:#202420; --ink-soft:#5B6158; --line:#DCD5C4; --brick:#B5502F; --denim:#35597A; --denim-soft:#E5EBF0;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:transparent; color:var(--ink); font-family:'Inter',sans-serif; line-height:1.5;}
  .wrap{max-width:1000px; margin:0 auto; padding:0 32px;}
  
  .page-head{padding: 36px 0; text-align: center; display: flex; flex-direction: column; align-items: center;}
  .eyebrow{font-family:'IBM Plex Mono',monospace; font-size:0.78rem; color:var(--brick); text-transform:uppercase; letter-spacing:0.08em; display:inline-flex; align-items:center; gap:8px; margin-bottom:16px;}
  .eyebrow::before{content:""; width:7px; height:7px; border-radius:50%; background:var(--brick);}
  h1{font-family:'Fraunces',serif; font-weight:500; font-size:clamp(2rem,3.6vw,2.8rem); margin-bottom:16px; letter-spacing:-0.01em;}
  .page-sub{color:var(--ink-soft); font-size:1.02rem; max-width:56ch; margin-bottom:28px;}

  .controls{display:flex; gap:12px; justify-content: center; flex-wrap:wrap; margin-bottom: 20px;}
  input[type=text]{font-family:'Inter',sans-serif; font-size:0.85rem; padding:10px 14px; border-radius:6px; border:1px solid var(--line); background:var(--paper-raised); color:var(--ink); outline:none; min-width:260px;}
  input:focus{border-color:var(--brick);}

  .btn{font-family:'IBM Plex Mono',monospace; font-size:0.82rem; padding:10px 18px; border-radius:5px; border:1px solid var(--ink); display:inline-block; transition:transform .15s ease; cursor:pointer; background:none;}
  .btn-primary{background:var(--ink); color:var(--paper);}
  .btn-primary:hover{transform:translateY(-1px); background:var(--brick); border-color:var(--brick);}
  .btn-ghost:hover{background:var(--ink); color:var(--paper);}
  .btn.small{padding:6px 12px; font-size:0.72rem;}
  .btn[disabled]{opacity:0.55; cursor:default; transform:none;}

  section.content{padding:12px 0 80px;}
  .grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(280px,1fr)); gap:20px;}
  .card{background:var(--paper-raised); border:1px solid var(--line); border-radius:10px; padding:24px; transition:box-shadow .15s ease, transform .15s ease;}
  .card:hover{box-shadow:0 8px 24px rgba(32,36,32,0.08); transform:translateY(-2px);}
  .card h3{font-family:'Fraunces',serif; font-weight:500; font-size:1.15rem; margin-bottom:4px;}
  .card .meta{font-size:0.82rem; color:var(--ink-soft); margin-bottom:10px; font-family:'IBM Plex Mono',monospace;}
  .card .desc{font-size:0.88rem; color:var(--ink-soft); margin-bottom:14px;}
  .tagrow{display:flex; flex-wrap:wrap; gap:6px;}
  .tag.role{font-family:'IBM Plex Mono',monospace; font-size:0.7rem; padding:4px 9px; border-radius:20px; font-weight:500; background:var(--denim-soft); color:var(--denim);}
  .card-foot{display:flex; justify-content:flex-end; align-items:center; margin-top:16px; padding-top:16px; border-top:1px dashed var(--line);}
  .empty{text-align:center; padding:70px 20px; color:var(--ink-soft); font-family:'IBM Plex Mono',monospace; font-size:0.85rem;}

  /* Modal */
  .modal-bg{position:fixed; inset:0; background:rgba(32,36,32,0.45); display:none; align-items:center; justify-content:center; z-index:100;}
  .modal-bg.show{display:flex;}
  .modal{background:var(--paper-raised); border:1px solid var(--line); border-radius:10px; padding:28px; width:min(420px,90vw);}
  .modal h3{font-family:'Fraunces',serif; font-size:1.2rem; margin-bottom:8px;}
  .modal textarea{width:100%; min-height:90px; font-family:'Inter',sans-serif; font-size:0.88rem; border-radius:6px; border:1px solid var(--line); padding:12px; resize:vertical; margin-bottom:18px;}
  .modal-actions{display:flex; justify-content:flex-end; gap:10px;}
</style>
</head>
<body>

<section class="page-head wrap">
  <h1>Project Matchmaker</h1>
  <p class="page-sub">Hackathons, term projects, side builds. Pitch your idea or search for the role you're best at.</p>
  <div class="controls">
    <input type="text" id="matchSearch" placeholder="Search by role or keyword…">
  </div>
</section>

<section class="content wrap">
  <div class="grid" id="matchGrid"></div>
</section>

<div class="modal-bg" id="modalBg">
  <div class="modal">
    <h3 id="modalTitle">Request to join</h3>
    <div class="modal-body" id="modalBody" style="font-size:0.85rem; color:var(--ink-soft); margin-bottom:14px;"></div>
    <textarea id="modalMsg" placeholder="Introduce yourself — what role are you looking to fill?"></textarea>
    <div class="modal-actions">
      <button class="btn btn-ghost small" id="modalCancel">Cancel</button>
      <button class="btn btn-primary small" id="modalSend">Send</button>
    </div>
  </div>
</div>

<script>
const pitches = [
  {title:"CampusHive — Smart IoT Attendance", desc:"Sensor-based check-in for lecture halls, feeding a live dashboard.", team:3, roles:["Need Hardware Expert","Need Backend"]},
  {title:"NoteSynth — AI Lecture Summarizer", desc:"Turn recorded lectures into structured, searchable study guides.", team:2, roles:["Need ML Engineer","Need UI/UX"]},
  {title:"GreenRoute — Campus Bike Planner", desc:"Route optimizer that scores paths by safety and elevation.", team:4, roles:["Need Mobile Dev"]},
  {title:"HackTrack — Hackathon Team Formation", desc:"The meta project: match hackers by skill gaps in real time.", team:1, roles:["Need Backend","Need Designer","Need PM"]}
];

function renderMatches(){
  const q = document.getElementById('matchSearch').value.toLowerCase();
  const grid = document.getElementById('matchGrid'); grid.innerHTML='';
  const filtered = pitches.filter(p => !q || p.title.toLowerCase().includes(q) || p.desc.toLowerCase().includes(q) || p.roles.some(r=>r.toLowerCase().includes(q)));
  if(filtered.length===0){ grid.innerHTML='<div class="empty">No pitches match.</div>'; return; }
  filtered.forEach((p, realIdx)=>{
    const card = document.createElement('div'); card.className='card';
    card.innerHTML = `
      <h3>${p.title}</h3>
      <div class="meta">Team of ${p.team}</div><div class="desc">${p.desc}</div>
      <div class="tagrow">${p.roles.map(r=>`<span class="tag role">${r}</span>`).join('')}</div>
      <div class="card-foot"><button class="btn btn-primary small" data-join="${realIdx}">Request to Join</button></div>
    `;
    grid.appendChild(card);
  });
  grid.querySelectorAll('[data-join]').forEach(b=>b.addEventListener('click', ()=>openModal(+b.dataset.join)));
}
document.getElementById('matchSearch').addEventListener('input', renderMatches);

const modalBg = document.getElementById('modalBg'), modalTitle = document.getElementById('modalTitle'), modalBody = document.getElementById('modalBody'), modalMsg = document.getElementById('modalMsg');
let modalIdx = null;
function openModal(idx){
  modalIdx = idx; const p = pitches[idx];
  modalTitle.textContent = `Request to join "${p.title}"`; modalBody.textContent = `Open roles: ${p.roles.join(', ')}`;
  modalMsg.value = ''; modalBg.classList.add('show'); modalMsg.focus();
}
document.getElementById('modalCancel').addEventListener('click', ()=>modalBg.classList.remove('show'));
modalBg.addEventListener('click', e=>{ if(e.target===modalBg) modalBg.classList.remove('show'); });
document.getElementById('modalSend').addEventListener('click', ()=>{
  modalBg.classList.remove('show');
  const btn = document.querySelector(`[data-join="${modalIdx}"]`);
  if(btn){ btn.textContent='Sent ✓'; btn.disabled = true; }
});
renderMatches();
</script>
</body>
</html>
