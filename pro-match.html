<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Project Matchmaker · C.Campus</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F6F3EC; --paper-raised:#FFFFFF; --ink:#202420; --ink-soft:#5B6158; --line:#DCD5C4;
    --moss:#2F6F4E; --moss-soft:#E7F0EA;
    --denim:#35597A; --denim-soft:#E5EBF0;
    --brick:#B5502F; --brick-soft:#F5E7DF;
    --theme-main:var(--moss); --theme-soft:var(--moss-soft);
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--paper);color:var(--ink);font-family:'Inter',sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased;}
  a{color:inherit;text-decoration:none;}
  .mono{font-family:'IBM Plex Mono',monospace;letter-spacing:0.02em;}
  ::selection{background:var(--moss-soft);color:var(--moss);}

  .hero{padding:40px 28px 8px;max-width:1180px;margin:0 auto;}
  .eyebrow{font-size:0.72rem;color:var(--theme-main);font-weight:500;text-transform:uppercase;letter-spacing:0.08em;margin-bottom:10px;display:flex;align-items:center;gap:8px;}
  .eyebrow::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--theme-main);}
  h1{font-family:'Fraunces',serif;font-weight:600;font-size:2.6rem;letter-spacing:-0.01em;}
  .hero p.sub{color:var(--ink-soft);margin-top:8px;font-size:0.98rem;max-width:560px;}

  .toolbar{max-width:1180px;margin:24px auto 0;padding:0 28px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;}
  .search-wrap{flex:1;min-width:220px;display:flex;align-items:center;gap:8px;background:var(--paper-raised);border:1px solid var(--line);border-radius:10px;padding:10px 14px;transition:border-color .2s ease;}
  .search-wrap:focus-within{border-color:var(--theme-main);}
  .search-wrap svg{flex-shrink:0;opacity:0.5;}
  .search-wrap input{border:none;outline:none;background:none;font-family:'Inter',sans-serif;font-size:0.9rem;width:100%;color:var(--ink);}

  .chips{display:flex;gap:8px;flex-wrap:wrap;max-width:1180px;margin:16px auto 0;padding:0 28px;}
  .chip{font-family:'IBM Plex Mono',monospace;font-size:0.74rem;padding:7px 14px;border-radius:20px;border:1px solid var(--line);color:var(--ink-soft);cursor:pointer;background:var(--paper-raised);transition:all .18s ease;}
  .chip:hover{border-color:var(--theme-main);color:var(--theme-main);}
  .chip.active{background:var(--theme-main);color:var(--paper);border-color:var(--theme-main);}

  .count-row{max-width:1180px;margin:20px auto 0;padding:0 28px;display:flex;justify-content:space-between;align-items:center;}
  .count-row span{font-family:'IBM Plex Mono',monospace;font-size:0.72rem;color:var(--ink-soft);}

  .grid{max-width:1180px;margin:16px auto 90px;padding:0 28px;display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px;}
  .card{background:var(--paper-raised);border:1px solid var(--line);border-radius:14px;padding:20px;opacity:0;transform:translateY(14px);animation:rise .5s ease forwards;transition:transform .25s ease,box-shadow .25s ease;}
  .card:hover{transform:translateY(-4px);box-shadow:0 14px 30px -14px rgba(32,36,32,0.18);}
  @keyframes rise{to{opacity:1;transform:translateY(0);}}

  .card-title{font-family:'Fraunces',serif;font-size:1.14rem;font-weight:500;margin-bottom:6px;}
  .card-desc{font-size:0.86rem;color:var(--ink-soft);margin-bottom:12px;}

  .team-row{display:flex;align-items:center;gap:8px;margin-bottom:12px;}
  .team-row span.mono{font-size:0.7rem;color:var(--ink-soft);}
  .team-dots{display:flex;gap:4px;}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--line);}
  .dot.filled{background:var(--theme-main);}

  .tagrow{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px;}
  .tag{font-family:'IBM Plex Mono',monospace;font-size:0.68rem;padding:4px 9px;border-radius:20px;font-weight:500;background:var(--denim-soft);color:var(--denim);}

  .card-foot{display:flex;justify-content:flex-end;padding-top:14px;border-top:1px dashed var(--line);}
  .btn{padding:9px 16px;border-radius:8px;border:none;cursor:pointer;font-family:'Inter',sans-serif;font-weight:600;font-size:0.82rem;transition:all .2s ease;}
  .btn:active{transform:scale(0.97);}
  .btn-primary{background:var(--theme-main);color:#fff;}
  .btn-primary:hover:not(:disabled){opacity:0.88;}
  .btn-primary:disabled{background:var(--line);color:var(--ink-soft);cursor:default;}

  .empty{max-width:1180px;margin:60px auto;padding:0 28px;text-align:center;color:var(--ink-soft);}
  .empty h3{font-family:'Fraunces',serif;font-size:1.3rem;color:var(--ink);margin-bottom:6px;}
  .hidden{display:none !important;}

  .modal-overlay{position:fixed;inset:0;background:rgba(32,36,32,0.45);display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .22s ease;z-index:200;}
  .modal-overlay.open{opacity:1;pointer-events:auto;}
  .modal{background:var(--paper-raised);border-radius:16px;padding:28px;width:380px;max-width:90vw;transform:translateY(16px) scale(0.97);transition:transform .22s ease;box-shadow:0 30px 60px -20px rgba(0,0,0,0.3);position:relative;}
  .modal-overlay.open .modal{transform:translateY(0) scale(1);}
  .modal h2{font-family:'Fraunces',serif;font-size:1.3rem;margin-bottom:4px;}
  .modal .item-name{font-size:0.85rem;color:var(--ink-soft);margin-bottom:18px;}
  .modal textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-family:'Inter',sans-serif;font-size:0.88rem;margin-bottom:16px;outline:none;background:var(--paper);min-height:90px;resize:vertical;transition:border-color .2s ease;}
  .modal textarea:focus{border-color:var(--theme-main);}
  .modal-close{position:absolute;top:16px;right:20px;background:none;border:none;font-size:1.3rem;color:var(--ink-soft);cursor:pointer;}

  .toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--paper);padding:13px 22px;border-radius:10px;font-family:'IBM Plex Mono',monospace;font-size:0.8rem;opacity:0;pointer-events:none;transition:all .3s ease;z-index:300;display:flex;align-items:center;gap:10px;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  .toast .dot-toast{width:7px;height:7px;border-radius:50%;background:var(--moss);}

  @media (max-width:640px){h1{font-size:2rem;} .hero,.toolbar,.chips,.count-row,.grid{padding-left:16px;padding-right:16px;}}
</style>
</head>
<body>

<section class="hero">
  <div class="eyebrow">Find your team</div>
  <h1>Project Matchmaker</h1>
  <p class="sub">Hackathons, term projects, side builds — pitch your idea or find the gap your skills fill.</p>
</section>

<div class="toolbar">
  <div class="search-wrap">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <input id="searchInput" type="text" placeholder="Search by title, role, or keyword…">
  </div>
</div>

<div class="chips" id="chips"></div>

<div class="count-row">
  <span id="countLabel" class="mono">— open pitches</span>
  <span class="mono">TEAM SIZE SHOWN AS FILLED · OPEN</span>
</div>

<div class="grid" id="grid"></div>
<div class="empty hidden" id="emptyState"><h3>No pitches match</h3><p>Try a different search term or role.</p></div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <button class="modal-close" onclick="closeModal()">×</button>
    <h2>Request to join</h2>
    <p class="item-name" id="modalItemName"></p>
    <textarea id="modalMsg" placeholder="Introduce yourself — what role are you looking to fill?"></textarea>
    <button class="btn btn-primary" style="width:100%;padding:12px;" onclick="submitJoin()">Send request</button>
  </div>
</div>

<div class="toast" id="toast"><span class="dot-toast"></span><span id="toastText">Request sent</span></div>

<script>
const PITCHES = [
  {id:1,title:'CampusHive — Smart IoT Attendance',desc:'Sensor-based check-in for lecture halls, feeding a live dashboard.',teamMax:4,teamFilled:2,roles:['Need Hardware Expert','Need Backend'],cat:'hardware'},
  {id:2,title:'NoteSynth — AI Lecture Summarizer',desc:'Turn recorded lectures into structured, searchable study guides.',teamMax:3,teamFilled:2,roles:['Need ML Engineer'],cat:'ai'},
  {id:3,title:'GreenRoute — Campus Bike Planner',desc:'Route optimizer that scores paths by safety and elevation.',teamMax:4,teamFilled:1,roles:['Need Mobile Dev','Need Designer'],cat:'mobile'},
  {id:4,title:'HackTrack — Team Formation Meta-App',desc:'The meta project: match hackers by skill gaps in real time.',teamMax:5,teamFilled:1,roles:['Need Backend','Need Designer','Need PM'],cat:'web'},
  {id:5,title:'PulseBoard — Dorm Energy Tracker',desc:'Live dashboard tracking per-floor energy use from smart plugs.',teamMax:4,teamFilled:3,roles:['Need Frontend'],cat:'hardware'},
  {id:6,title:'StudyBuddy Match — Peer Tutoring AI',desc:'Recommends tutoring pairs based on course history and grades.',teamMax:3,teamFilled:1,roles:['Need ML Engineer','Need UI/UX'],cat:'ai'}
];

const CATS=['all','ai','hardware','mobile','web'];
let activeCat='all';
function renderChips(){
  document.getElementById('chips').innerHTML = CATS.map(c=>
    `<button class="chip ${c===activeCat?'active':''}" data-cat="${c}">${c==='all'?'All projects':c.toUpperCase()}</button>`
  ).join('');
  document.querySelectorAll('.chip').forEach(b=>b.addEventListener('click',()=>{activeCat=b.dataset.cat;renderChips();render();}));
}

function render(){
  const q=document.getElementById('searchInput').value.toLowerCase();
  const list = PITCHES.filter(p =>
    (activeCat==='all'||p.cat===activeCat) &&
    (!q || p.title.toLowerCase().includes(q) || p.desc.toLowerCase().includes(q) || p.roles.some(r=>r.toLowerCase().includes(q)))
  );
  document.getElementById('countLabel').textContent = `${list.length} open pitch${list.length!==1?'es':''}`;
  document.getElementById('emptyState').classList.toggle('hidden', list.length>0);

  document.getElementById('grid').innerHTML = list.map((p,idx)=>`
    <div class="card" style="animation-delay:${idx*0.05}s">
      <div class="card-title">${p.title}</div>
      <div class="card-desc">${p.desc}</div>
      <div class="team-row">
        <span class="mono">TEAM</span>
        <div class="team-dots">${Array.from({length:p.teamMax}).map((_,i)=>`<span class="dot ${i<p.teamFilled?'filled':''}"></span>`).join('')}</div>
        <span class="mono">${p.teamFilled}/${p.teamMax}</span>
      </div>
      <div class="tagrow">${p.roles.map(r=>`<span class="tag">${r}</span>`).join('')}</div>
      <div class="card-foot"><button class="btn btn-primary" onclick="openModal(${p.id})">Request to Join</button></div>
    </div>
  `).join('');
}

let modalPitch=null;
function openModal(id){
  modalPitch = PITCHES.find(p=>p.id===id);
  document.getElementById('modalItemName').textContent = `${modalPitch.title} · ${modalPitch.roles.join(', ')}`;
  document.getElementById('modalMsg').value='';
  document.getElementById('modalOverlay').classList.add('open');
}
function closeModal(){ document.getElementById('modalOverlay').classList.remove('open'); }
function submitJoin(){
  if(!modalPitch) return;
  closeModal();
  showToast(`Request sent to join "${modalPitch.title}"`);
}
function showToast(text){
  const t=document.getElementById('toast');
  document.getElementById('toastText').textContent=text;
  t.classList.add('show');
  clearTimeout(window._toastTimer);
  window._toastTimer=setTimeout(()=>t.classList.remove('show'),2800);
}
document.getElementById('modalOverlay').addEventListener('click',e=>{if(e.target.id==='modalOverlay')closeModal();});
document.getElementById('searchInput').addEventListener('input',render);

renderChips();
render();
</script>
</body>
</html>
